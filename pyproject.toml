[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-factory"
version = "0.1.0"
description = "API-driven vertical Shorts/Reels generator with OpenAI imagery and Claude SVG art"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow>=10,<13", "httpx>=0.27,<1", "python-dotenv>=1,<2", "CairoSVG>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
shorts-factory = "shorts_factory.cli:main"

[tool.setuptools.packages.find]
include = ["shorts_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
